# ============================================================
#  PlaytimeGate
#  Пока игрок не наиграл нужное время, в приватах WorldGuard
#  ему запрещены действия (ломать, ставить, открывать, использовать).
#  Вход при этом не блокируется. Как только порог набран —
#  плагин перестаёт вмешиваться, и работают обычные правила WorldGuard.
# ============================================================

# Сколько нужно наиграть. Форматы: 24h, 90m, 1d12h30m, 3600s.
# Число без буквы трактуется как МИНУТЫ (1440 = 24 часа).
required-playtime: "24h"

# Не ограничивать игрока в его собственных приватах и там, где он участник (member).
exempt-own-regions: true

# Регионы, на которые ограничение не распространяется (например, спавн, магазин, ивент-зона).
# Указываются ID регионов, регистр не важен.
exempt-regions: []

# Миры, в которых плагин вообще ничего не проверяет.
exempt-worlds: []

# Что именно блокировать у новичков.
block:
  # Нажатия на плиты, растяжки, тропинки и прочие "физические" взаимодействия.
  # true — новичок не сможет наступить на плиту/растяжку в привате.
  physical-interactions: false
  # Урон по животным, жителям, стойкам для брони в привате.
  # PvP не затрагивается — им управляют флаги WorldGuard.
  entity-damage: true

# ------------------------------------------------------------
#  Стандартный шаблон создаваемых регионов.
#  Любой новый регион, созданный игроком командой /rg create (или
#  /rg define, /rg def, /rg d, /rg claim), получает эти флаги.
#  Значения: true/false или строка (для строковых флагов WorldGuard).
# ------------------------------------------------------------
region-template:
  enabled: true
  flags:
    build: false
    use: false
    mob-damage: false

# ------------------------------------------------------------
#  Права на создание приватов.
#  Пермишны ниже выдаются ВСЕМ игрокам (default: true), чтобы каждый
#  мог создать свой приват. Новичкам (не наигравшим порог) создание
#  всё равно запрещено — им показывается сообщение creation-denied.
# ------------------------------------------------------------
region-creation:
  enabled: true
  permissions:
    - worldguard.region.define
    - worldguard.region.wand

# Настройки сообщения об отказе.
message:
  # true — показывать в action bar (над хотбаром), false — в чат.
  use-action-bar: true
  # Не спамить игроку чаще, чем раз в N секунд.
  cooldown-seconds: 5

# Топ игроков для /ptop.
top:
  # Сколько игроков хранить в кэше.
  size: 100
  # Сколько строк показывать на одной странице.
  page-size: 10
  # Как часто пересобирать топ (в минутах).
  refresh-minutes: 10
  # Сколько игроков обрабатывать за один тик при сборе статистики.
  # Меньше — плавнее, больше — быстрее собирается.
  scan-batch-size: 100

# ------------------------------------------------------------
#  AFK-трекинг и префикс в табе (нужен плагин TAB, опционально).
#  Игрок считается AFK, если за threshold-seconds не было активной
#  активности: ввода с клавиатуры, правого клика, работы с инвентарём,
#  чата, команд, взаимодействия с сущностями, полёта на элитре и
#  собственного хода (на земле, без отброса/потока/транспорта).
#  Левый клик (автокликер) и перемещение потоком/отбросом
#  активностью НЕ считаются.
#  Чтобы префикс появился в табе, добавьте плейсхолдер
#  %playtimegate-afk% в формат таб-листа TAB (раздел tablist,
#  строка prefix или name).
# ------------------------------------------------------------
afk:
  enabled: true
  # Через сколько секунд без активности помечать игрока как AFK.
  threshold-seconds: 300
  # Префикс в табе у AFK-игрока. Пустая строка = ничего показывать.
  tab-prefix: "&8[AFK]&r "
  # Префикс в табе у игрока на экране смерти. Пустая строка = ничего.
  dead-prefix: "&4[СМЕРТЬ]&r "

# ------------------------------------------------------------
#  Сообщения. Поддерживаются цветовые коды через & (например &c, &l).
#  Плейсхолдеры: {prefix}, {player}, {played}, {required}, {left},
#  {status}, {hint}, {position}, {page}, {pages}, {total}.
# ------------------------------------------------------------
messages:
  prefix: "&8[&ePlaytimeGate&8] &r"
  no-permission: "{prefix}&cУ вас нет прав на это."
  players-only: "{prefix}&cКоманда доступна только игрокам."
  player-not-found: "{prefix}&cИгрок &f{player}&c не найден."
  reloaded: "{prefix}&aКонфигурация перезагружена."

  denied: "{prefix}&cЭтот приват недоступен: нужно {required} игры. Осталось {left}."

  creation-denied: "{prefix}&cСоздавать приваты можно после {required} игры. Осталось {left}."

  status:
    open: "&aдоступны"
    closed: "&cзакрыты"

  hint-open: "&7Ограничение приватов снято."
  hint-closed: "&7До открытия приватов: &f{left}"

  self:
    - "&8&m--------&r &eВаша статистика &8&m--------"
    - "&7Наиграно: &f{played}"
    - "&7Приваты: {status}"
    - "{hint}"

  other:
    - "&8&m--------&r &e{player} &8&m--------"
    - "&7Наиграно: &f{played}"
    - "&7Приваты: {status}"

  top-header:
    - "&8&m------&r &6Топ по наигранному времени &8&m------"
  top-row: "&7{position}. &f{player} &8— &e{played}"
  top-footer: "&7Страница &f{page}&7/&f{pages} &8| &7игроков в топе: &f{total}"
  top-empty: "{prefix}&eСтатистика ещё собирается, попробуйте через пару секунд."
